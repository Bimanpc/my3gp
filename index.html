<!DOCTYPE html>
<html lang="pnt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Βιντέον Παίκτες 3GP - Ποντιακά</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#1e1e1e;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}
.container{
    max-width:800px;
    margin:auto;
}
h1{
    color:#4CAF50;
}
video{
    width:100%;
    max-height:500px;
    background:black;
    border-radius:10px;
}
input[type=file]{
    margin:15px;
}
.controls{
    margin-top:10px;
}
button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:6px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}
button:hover{
    background:#45a049;
}
#info{
    margin-top:10px;
    color:#ccc;
}
</style>
</head>
<body>

<div class="container">
    <h1>🎬 Βιντέον Παίκτες 3GP</h1>

    <p>Διάλεξον έν' αρχείον 3GP να παίζ'ς το.</p>

    <input type="file" id="fileInput" accept=".3gp,video/*">

    <video id="player" controls></video>

    <div class="controls">
        <button onclick="playVideo()">▶ Παίξον</button>
        <button onclick="pauseVideo()">⏸ Σταμάτα</button>
        <button onclick="stopVideo()">⏹ Τέλος</button>
    </div>

    <div id="info">Κανέν βιντέον ανοιγμένον.</div>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const player = document.getElementById("player");
const info = document.getElementById("info");

fileInput.addEventListener("change", function() {
    const file = this.files[0];

    if(file){
        const url = URL.createObjectURL(file);
        player.src = url;

        info.innerHTML =
            "📁 Όνομα: " + file.name +
            "<br>📦 Μέγεθος: " +
            (file.size / 1024 / 1024).toFixed(2) +
            " MB";
    }
});

function playVideo(){
    player.play();
}

function pauseVideo(){
    player.pause();
}

function stopVideo(){
    player.pause();
    player.currentTime = 0;
}
</script>

</body>
</html>
